[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "obsdeps"
version = "1.0.0"
description = "Explain Maven dependency resolution inside explicit observation contexts"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
obsdeps = "obsdeps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
